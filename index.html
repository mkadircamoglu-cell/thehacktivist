<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kişisel Profil Sayfası">
    <meta name="theme-color" content="#0f0f0f">
    <title>Profil</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/images/default-avatar.png" type="image/png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS Dosyaları -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/youtube-bg.css">
    <link rel="stylesheet" href="css/glassmorphism.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============================================= -->
<!--        KATMAN 1: YouTube Arka Plan Video       -->
<!-- ============================================= -->
<div id="youtube-bg" class="youtube-background">
    <div id="youtube-overlay" class="youtube-overlay"></div>
    <iframe
        id="youtube-player"
        class="youtube-iframe"
        src=""
        title="Background Video"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        loading="lazy"
    ></iframe>
</div>


    <!-- ============================================= -->
    <!--     KATMAN 2: Overlay Efektleri (Kar/Matrix)   -->
    <!-- ============================================= -->
    <canvas id="effects-canvas" class="effects-overlay"></canvas>


    <!-- ============================================= -->
    <!--       KATMAN 3: Ana Profil İçerik Alanı        -->
    <!-- ============================================= -->
    <main class="profile-wrapper">
        <div id="profile-card" class="profile-card glass">

            <!-- ===== Profil Fotoğrafı ===== -->
            <div class="avatar-container" id="avatar-container">
                <div class="avatar-ring" id="avatar-ring"></div>
                <div class="avatar-glow" id="avatar-glow"></div>
                <img
                    id="avatar"
                    class="avatar"
                    src="assets/images/default-avatar.png"
                    alt="Profil Fotoğrafı"
                    draggable="false"
                >
            </div>

            <!-- ===== Kullanıcı Adı ===== -->
            <div class="username-wrapper" id="username-wrapper">
                <h1 id="username" class="username">Yükleniyor...</h1>
            </div>

            <!-- ===== Biyografi / Açıklama ===== -->
            <p id="description" class="description"></p>

            <!-- ===== Konum ===== -->
            <div id="location-container" class="location-container hidden">
                <svg class="location-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                <span id="location-text" class="location-text"></span>
            </div>

            <!-- ===== Ayırıcı Çizgi ===== -->
            <div class="divider" id="divider"></div>

            <!-- ===== Sosyal Medya İkonları ===== -->
            <div id="socials-container" class="socials-container">
                <!-- JS tarafından config.json'dan dinamik olarak doldurulacak -->
            </div>

        </div>

        <!-- ============================================= -->
        <!--        🆕 BLOG BUTONU (Profil Kartı Altı)      -->
        <!-- ============================================= -->
        <a href="blog.html" id="blog-button" class="blog-button glass" aria-label="Blog Sayfası">
            <svg class="blog-button-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span class="blog-button-text">BLOG</span>
            <svg class="blog-button-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
            </svg>
        </a>

    </main>


    <!-- ============================================= -->
    <!--          KATMAN 4: Ses Kontrol Butonu           -->
    <!-- ============================================= -->
    <button id="sound-toggle" class="sound-toggle hidden" aria-label="Sesi Aç/Kapat">
        <!-- Ses Kapalı İkonu (varsayılan) -->
        <svg id="icon-muted" class="sound-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
        <!-- Ses Açık İkonu -->
        <svg id="icon-unmuted" class="sound-icon hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
    </button>


    <!-- ============================================= -->
    <!--          KATMAN 5: Yükleme Ekranı              -->
    <!-- ============================================= -->
    <div id="loader" class="loader-overlay">
        <div class="loader-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>
    </div>


    <!-- ============================================= -->
    <!--               JavaScript Dosyaları             -->
    <!-- ============================================= -->
    <script src="js/config-loader.js"></script>
    <script src="js/youtube-bg.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/glow.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
